[package]
name = "jumpzippier"
version = "0.0.1"
edition = "2021"
description = "Pure-Rust BCJ2 (Branch/Call/Jump filter v2) decoder, part of the 8z umbrella"
license = "Zlib"
repository = "https://github.com/JackDanger/jumpzippier"
authors = ["Jack Danger Canty"]
build = "build.rs"

[dependencies]
thiserror = "1"
# Phase 1 wrapper backend: lzma-rust2 provides the BCJ2 multi-stream decoder.
# Phase 2 will replace this with jumpzippier's own native BCJ2 implementation.
lzma-rust2 = { version = "0.16", features = ["encoder"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false
