name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-matrix:
    name: Build & Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.runner }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --release

  # Aggregator — this is the status check name the branch ruleset requires.
  # It passes only when every matrix entry above passes.
  build:
    name: build
    needs: build-matrix
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify matrix succeeded
        run: |
          if [[ "${{ needs.build-matrix.result }}" != "success" ]]; then
            echo "build-matrix did not succeed: ${{ needs.build-matrix.result }}"
            exit 1
          fi
          echo "All matrix entries passed."
